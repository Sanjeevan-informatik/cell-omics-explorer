name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and minimal synthetic input
      description: Include workspace, browser, and version. Do not attach patient data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
