name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package tagged source
        run: git archive --format=zip --prefix=cell-omics-explorer/ HEAD -o cell-omics-explorer-source.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" cell-omics-explorer-source.zip --verify-tag --generate-notes
